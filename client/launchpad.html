<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Launchpad · Kairos</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/k.css"><link rel="stylesheet" href="/kairos.css">
<meta name="description" content="Launch a native token on Kairos: fixed supply, KAIROS backing holders can redeem, a bonding curve that graduates into a native liquidity pool. No signatures, no EVM.">
<meta property="og:title" content="The Kairos launchpad"><meta property="og:image" content="/og.png">
<style>
.hd{padding:44px 0 6px;display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap}.hd h1{font-weight:800;letter-spacing:-.055em;line-height:.92;font-size:clamp(44px,5.6vw,84px);margin-top:14px}.hd p{color:var(--ink2);max-width:640px;margin-top:12px;font-size:17px}
.wb{display:flex;gap:10px;align-items:center;border:1px solid var(--rule2);border-radius:16px;background:var(--card);padding:10px 12px 10px 18px;font-family:'Geist Mono';font-size:13px}.wb b{color:var(--gold);font-weight:500}
.tabs{display:flex;gap:8px;margin:22px 0 16px;flex-wrap:wrap}.tabs button{height:42px;padding:0 18px;border-radius:12px;border:1px solid var(--rule2);background:none;color:var(--ink2);font-family:'Geist Mono';font-size:12px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer}.tabs button.on{border-color:var(--gold);color:var(--gold);background:rgba(255,195,90,.06)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.tc{border:1px solid var(--rule2);border-radius:18px;background:var(--card);padding:18px 18px 16px;cursor:pointer;transition:.15s}.tc:hover{border-color:var(--gold);transform:translateY(-2px)}
.lg{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:20px;border:1.5px solid}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.kv div{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--rule);font-size:13.5px}.kv span{color:var(--ink3);font-family:'Geist Mono';font-size:11px;letter-spacing:.1em;text-transform:uppercase}.kv b{font-family:'Geist Mono';font-weight:500}
.bar{height:8px;border-radius:5px;background:rgba(244,241,234,.07);overflow:hidden;margin:8px 0 12px}.bar i{display:block;height:100%;background:var(--g);border-radius:5px}
.badge{font-family:'Geist Mono';font-size:10px;letter-spacing:.14em;text-transform:uppercase;padding:4px 8px;border-radius:7px;border:1px solid var(--rule2);color:var(--ink3)}.badge.g{border-color:rgba(125,255,178,.5);color:#7dffb2}
.pan{border:1px solid var(--rule2);border-radius:18px;background:var(--card);padding:20px}.pan h3{font-family:'Geist Mono';font-weight:500;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink3);margin-bottom:12px;display:flex;justify-content:space-between}
.tl{display:grid;grid-template-columns:1.5fr 1fr;gap:14px;align-items:start}.in{width:100%;height:46px;border-radius:12px;border:1px solid var(--rule2);background:rgba(4,5,10,.6);color:var(--fg);font-family:'Geist Mono';font-size:14px;padding:0 14px;outline:none}.in:focus{border-color:var(--gold)}
.lbl{font-family:'Geist Mono';font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);margin:14px 0 6px;display:flex;justify-content:space-between}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}.seg button{height:44px;border-radius:12px;border:1px solid var(--rule2);background:none;color:var(--ink2);font-family:'Geist Mono';font-size:12px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer}.seg button.on.b{background:rgba(125,255,178,.14);border-color:#7dffb2;color:#7dffb2}.seg button.on.s{background:rgba(255,93,79,.12);border-color:#ff5d4f;color:#ff8b80}.seg button.on.n{background:rgba(255,195,90,.1);border-color:var(--gold);color:var(--gold)}
.big{font-size:30px;font-weight:800;letter-spacing:-.03em;font-family:'Geist Mono'}#cv{width:100%;height:300px;display:block}
.msg{margin-top:12px;font-size:13.5px;font-family:'Geist Mono'}.ok{color:#7dffb2}.no{color:#ff8b80}
.tr{display:grid;grid-template-columns:60px 1fr 1fr 80px;gap:8px;font-family:'Geist Mono';font-size:12px;padding:7px 0;border-bottom:1px solid var(--rule)}
.empty{text-align:center;padding:50px 20px;color:var(--ink3)}
@media(max-width:1000px){.grid{grid-template-columns:1fr}.tl{grid-template-columns:1fr}}
</style></head><body>
<main class="wrap">
<section class="hd"><div><div class="eyebrow"><b>●</b> Kairos launchpad · web testnet</div><h1>Launch a token <span class="it red">on Kairos.</span></h1><p>Native tokens with a fixed supply and a KAIROS backing holders can always redeem. They launch on a bonding curve and graduate into a native liquidity pool. No signatures, no EVM, no L2.</p></div><div class="wb" id="wb"></div></section>
<div class="tabs" id="tabs"></div>
<div id="view"></div>
</main>
<script src="/k.js"></script><script src="/kairos-keys.js"></script><script>chrome('/launchpad');
const KK = window.KairosKeys, ONE = 1e6, f6 = (u, d = 2) => (Number(u) / ONE).toLocaleString(undefined, { maximumFractionDigits: d }), fmtP = (p) => p == null ? '—' : p < .0001 ? p.toExponential(2) : p.toLocaleString(undefined, { maximumFractionDigits: 6 });
const api = async (p, b) => { const r = await fetch(p, b ? { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(b) } : {}); return r.json(); };
const esc = (s) => String(s).replace(/[<>&"]/g, (c) => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;' }[c]));
let M = null, ACC = [], TAB = 'launchpad', CUR = null, SIDE = 'buy', MODE = 'launch', ASSETS = [];
try { M = localStorage.getItem('kai_master'); } catch {}
// ---------- wallet ----------
async function scan() { if (!M) return; const out = []; let gap = 0;
  for (let i = 0; i < 80 && gap < 3; i++) { const a = KK.address(M, i), [r, h] = await Promise.all([api('/api/tn/address/' + a), api('/api/tn/holdings/' + a)]); const used = !!(r.retired || (r.history && r.history.length) || r.pending);
    out.push({ i, a, kai: BigInt(r.balance || 0), retired: r.retired, used, pending: r.pending, hold: h.holdings || [] }); gap = used ? 0 : gap + 1; } ACC = out; drawWallet(); }
const lastUsed = () => ACC.reduce((m, x) => (x.used ? x.i : m), -1), fresh = () => KK.address(M, lastUsed() + 1);
function pickFor(assetId) { const live = ACC.filter((x) => !x.retired && x.kai > 0n); if (assetId) { const w = live.find((x) => x.hold.some((h) => h.id === assetId)); if (w) return w; } return live.sort((a, b) => (b.kai > a.kai ? 1 : -1))[0]; }
function drawWallet() { if (!M) { $('wb').innerHTML = '<span>No wallet on this device</span><a class="btn pri" href="/wallet">Open wallet</a>'; return; }
  const k = ACC.reduce((s, x) => s + x.kai, 0n); $('wb').innerHTML = `<span>KAIROS</span><b>${f6(k, 4)}</b><span style="color:var(--ink3)">${ACC.length ? fresh().slice(0, 10) + '…' : ''}</span><button class="btn" onclick="drip()">Faucet</button><a class="btn" href="/mine#${M ? fresh() : ''}">Mine</a>`; }
async function drip() { const r = await api('/api/tn/faucet', { to: fresh() }); toast(r.error || 'Faucet sent 25 test KAIROS; it lands in the next block'); setTimeout(scan, 2000); }
async function send(op, assetId, msgEl) { if (!M) return toast('Open your wallet first');
  const w = pickFor(assetId); if (!w) { $(msgEl).innerHTML = '<span class="no">No KAIROS in this wallet yet. Use the faucet or mine a block.</span>'; return; }
  if (w.pending) { $(msgEl).innerHTML = '<span class="no">You have a transaction waiting for the next block. Try again in a few seconds.</span>'; return; }
  const r = await api('/api/tn/op', { secret: KK.spendSecret(M, w.i), next: fresh(), op });
  if (r.error) { $(msgEl).innerHTML = `<span class="no">${esc(r.error)}</span>`; return; }
  $(msgEl).innerHTML = `<span class="ok">Sent. Settles in the next block…</span>`; w.pending = 1;
  for (let k = 0; k < 60; k++) { await new Promise((s) => setTimeout(s, 3000)); const t = await api('/api/explorer/tx/' + r.txid); if (t && t.result) { $(msgEl).innerHTML = t.result.ok ? `<span class="ok">✓ ${esc(t.result.note)} · block ${t.height}</span>` : `<span class="no">✗ ${esc(t.result.error)} · KAIROS refunded</span>`; break; } }
  await scan(); await load(); }
// ---------- data ----------
async function load() { ASSETS = (await api('/api/tn/assets')).assets || []; render(); }
const TABS = [['launchpad', 'Launchpad'], ['trade', 'Trade'], ['liquidity', 'Liquidity'], ['create', 'Create'], ['mine', 'My tokens']];
function setTab(t) { TAB = t; render(); }
function render() { $('tabs').innerHTML = TABS.map(([k, l]) => `<button class="${TAB === k ? 'on' : ''}" onclick="setTab('${k}')">${l}</button>`).join(''); ({ launchpad: vLaunch, trade: vTrade, liquidity: vLiq, create: vCreate, mine: vMine })[TAB](); }
const logo = (a, s = 44) => `<div class="lg" style="width:${s}px;height:${s}px;border-color:${a.color};color:${a.color};background:${a.color}14">${esc(a.ticker[0])}</div>`;
function vLaunch() { $('view').innerHTML = ASSETS.length ? `<div class="grid">${ASSETS.map((a) => `<div class="tc" onclick="openA('${a.id}')"><div class="row"><div style="display:flex;gap:12px;align-items:center">${logo(a)}<div><b style="font-size:18px">${esc(a.name)}</b><div class="mono" style="font-size:12px;color:var(--ink3)">$${esc(a.ticker)}</div></div></div><span class="badge ${a.graduated ? 'g' : ''}">${a.mode === 'direct' ? 'direct issue' : a.graduated ? 'graduated · pool' : 'launching'}</span></div>
   ${a.mode === 'launch' ? `<div class="row" style="margin-top:14px;font-family:'Geist Mono';font-size:12.5px"><span style="color:var(--ink3)">LAUNCH PROGRESS</span><span>${Math.min(100, a.progress).toFixed(0)}% · ${f6(a.raised)} / ${f6(a.raiseTarget)} KAIROS</span></div><div class="bar"><i style="width:${Math.min(100, a.progress)}%"></i></div>` : '<div style="height:14px"></div>'}
   <div class="kv"><div><span>Fixed supply</span><b>${f6(a.supply, 0)}</b></div><div><span>Backing / token</span><b>${(Number(a.backing) / ONE).toFixed(6)}</b></div><div><span>Price · KAIROS</span><b>${fmtP(a.price)}</b></div><div><span>Holders · trades</span><b>${a.holders} · ${a.trades}</b></div></div></div>`).join('')}</div>
   <div class="pan" style="margin-top:14px"><h3><span>One asset · launchpad to pool</span></h3><div class="kv"><div><span>Launch</span><b>Fixed supply · native curve · 80% sold on the curve</b></div><div><span>Graduation</span><b>Same asset id · native pool with the other 20%, liquidity locked</b></div><div><span>Holder backing</span><b>Reserved for the token's whole life, redeemable by burning</b></div></div></div>`
   : `<div class="pan empty"><b style="font-size:22px;color:var(--fg)">No tokens yet.</b><p style="margin-top:8px">Be the first to launch one on the Kairos testnet.</p><button class="btn pri" style="margin-top:16px" onclick="setTab('create')">Launch a token</button></div>`; }
function openA(id) { CUR = id; setTab('trade'); }
async function vTrade() { const a0 = ASSETS.find((x) => x.id === CUR) || ASSETS[0]; if (!a0) return vLaunch(); CUR = a0.id; const a = await api('/api/tn/asset/' + CUR);
  $('view').innerHTML = `<div class="tl"><div class="pan"><div class="row"><div style="display:flex;gap:14px;align-items:center">${logo(a, 52)}<div><b style="font-size:22px">${esc(a.name)}</b><div class="mono" style="font-size:12.5px;color:var(--ink3)">$${esc(a.ticker)} / KAIROS · ${a.graduated ? 'native pool' : a.mode === 'launch' ? 'bonding curve' : 'no market yet'}</div></div></div><div style="text-align:right"><div class="lbl" style="margin:0 0 4px;justify-content:flex-end">price</div><div class="big g" style="background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent">${fmtP(a.price)}</div></div></div>
    <select class="in" style="margin-top:14px;height:40px" onchange="CUR=this.value;render()">${ASSETS.map((x) => `<option value="${x.id}" ${x.id === CUR ? 'selected' : ''}>$${esc(x.ticker)} · ${esc(x.name)}</option>`).join('')}</select>
    <canvas id="cv" width="1400" height="600" style="margin-top:12px"></canvas>
    <div class="kv" style="margin-top:10px"><div><span>Volume · KAIROS</span><b>${a.volume.toLocaleString(undefined, { maximumFractionDigits: 2 })}</b></div><div><span>${a.pool ? 'Pool liquidity' : 'Raised'}</span><b>${a.pool ? f6(a.pool.kai) + ' KAIROS + ' + f6(a.pool.tok, 0) + ' ' + esc(a.ticker) : f6(a.raised) + ' / ' + f6(a.raiseTarget) + ' KAIROS'}</b></div><div><span>Backing reserve</span><b>${f6(a.reserve, 4)} KAIROS</b></div><div><span>Creator</span><b>${a.creator.slice(0, 14)}…</b></div></div>
    <h3 style="margin-top:18px">Recent trades</h3>${a.recent.slice(0, 10).map((t) => `<div class="tr"><span style="color:${t.side === 'buy' ? '#7dffb2' : '#ff8b80'}">${t.side.toUpperCase()}</span><span>${f6(t.tok, 2)} ${esc(a.ticker)}</span><span>${f6(t.kai, 4)} KAIROS</span><span style="color:var(--ink3)">#${t.h}</span></div>`).join('') || '<p class="dim" style="font-size:13px">No trades yet.</p>'}</div>
   <div class="pan"><h3><span>Swap</span><span>settles next block</span></h3><div class="seg"><button class="b ${SIDE === 'buy' ? 'on' : ''}" onclick="SIDE='buy';render()">Buy ${esc(a.ticker)}</button><button class="s ${SIDE === 'sell' ? 'on' : ''}" onclick="SIDE='sell';render()">Sell ${esc(a.ticker)}</button></div>
    <div class="lbl"><span>You pay · ${SIDE === 'buy' ? 'KAIROS' : esc(a.ticker)}</span><span id="avail"></span></div><input class="in" id="amt" inputmode="decimal" placeholder="0.0" oninput="quote()">
    <div class="lbl"><span>Estimated received</span></div><div class="big" id="est">0</div>
    <div class="lbl"><span>Price limit</span><span>max 2% slippage</span></div><div class="mono" style="font-size:13px;color:var(--ink2)">Your limit is binding: if the price moves past it, the swap does not fill and your KAIROS is refunded.</div>
    <button class="btn pri" style="width:100%;justify-content:center;margin-top:16px;height:50px" onclick="doSwap()">Review &amp; swap</button><div class="msg" id="sm"></div></div></div>`;
  window._A = a; drawChart(a); quote(); const w = ACC; const tok = w.reduce((s, x) => s + BigInt((x.hold.find((h) => h.id === a.id) || {}).bal || 0), 0n);
  $('avail').textContent = 'available ' + (SIDE === 'buy' ? f6(w.reduce((s, x) => s + x.kai, 0n), 4) + ' KAIROS' : f6(tok, 2)); }
function est(a, side, amt) { const A = BigInt(Math.floor(amt * ONE)); if (A <= 0n) return 0n;
  if (!a.pool && a.mode === 'launch') { const Tc = BigInt(a.curveTokens), x = BigInt(a.vb) + BigInt(a.raised), y = Tc * 5n / 4n - BigInt(a.sold), k = x * y;
    if (side === 'buy') { const left = BigInt(a.raiseTarget) - BigInt(a.raised), u = A > left ? left : A; let o = y - (k + x + u - 1n) / (x + u); const rem = Tc - BigInt(a.sold); return o > rem ? rem : o; } return x - (k + y + A - 1n) / (y + A); }
  if (a.pool) { const X = BigInt(a.pool.kai), Y = BigInt(a.pool.tok), inF = A * 9970n / 10000n; return side === 'buy' ? Y - (X * Y + X + inF - 1n) / (X + inF) : X - (X * Y + Y + inF - 1n) / (Y + inF); } return 0n; }
function quote() { const a = window._A; if (!a) return; const v = parseFloat($('amt').value) || 0, o = est(a, SIDE, v); $('est').textContent = f6(o, 4) + ' ' + (SIDE === 'buy' ? a.ticker : 'KAIROS'); window._q = o; }
function doSwap() { const a = window._A, v = parseFloat($('amt').value) || 0; if (v <= 0) return toast('Enter an amount'); const min = (window._q * 98n / 100n).toString(), amt = String(Math.floor(v * ONE));
  send(SIDE === 'buy' ? { type: 'buy', asset: a.id, kai: amt, min } : { type: 'sell', asset: a.id, tok: amt, min }, SIDE === 'sell' ? a.id : null, 'sm'); }
function drawChart(a) { const cv = $('cv'), g = cv.getContext('2d'), W = cv.width, H = cv.height; g.clearRect(0, 0, W, H); const cs = a.candles;
  g.strokeStyle = 'rgba(244,241,234,.06)'; for (let i = 1; i < 5; i++) { g.beginPath(); g.moveTo(0, H * i / 5); g.lineTo(W, H * i / 5); g.stroke(); }
  if (!cs.length) { g.fillStyle = '#6b6a66'; g.font = '28px Geist Mono'; g.textAlign = 'center'; g.fillText('first trade draws the chart', W / 2, H / 2); return; }
  const lo = Math.min(...cs.map((c) => c.l)) * .97, hi = Math.max(...cs.map((c) => c.h)) * 1.03, Y = (p) => H - 30 - (p - lo) / (hi - lo || 1) * (H - 60), bw = Math.min(40, (W - 120) / cs.length * .7);
  cs.forEach((c, i) => { const x = 40 + i * (W - 120) / Math.max(1, cs.length - 1 || 1), up = c.c >= c.o, col = up ? '#7dffb2' : '#ff5d4f'; g.strokeStyle = col; g.fillStyle = col; g.lineWidth = 2; g.beginPath(); g.moveTo(x, Y(c.h)); g.lineTo(x, Y(c.l)); g.stroke(); const t = Y(Math.max(c.o, c.c)), b = Y(Math.min(c.o, c.c)); g.fillRect(x - bw / 2, t, bw, Math.max(3, b - t)); });
  const last = cs[cs.length - 1].c; g.setLineDash([6, 6]); g.strokeStyle = 'rgba(255,195,90,.6)'; g.beginPath(); g.moveTo(0, Y(last)); g.lineTo(W, Y(last)); g.stroke(); g.setLineDash([]); g.fillStyle = '#ffc35a'; g.font = '24px Geist Mono'; g.textAlign = 'right'; g.fillText(fmtP(last), W - 8, Y(last) - 8); }
async function vLiq() { const a0 = ASSETS.find((x) => x.id === CUR && x.pool) || ASSETS.find((x) => x.pool); if (!a0) { $('view').innerHTML = '<div class="pan empty">No pools yet. A launch opens its pool when it graduates; a direct-issue token opens one with its first liquidity.</div>'; return; }
  CUR = a0.id; const a = await api('/api/tn/asset/' + CUR), lp = ACC.reduce((s, x) => s + BigInt((x.hold.find((h) => h.id === a.id) || {}).lp || 0), 0n);
  $('view').innerHTML = `<div class="tl"><div class="pan"><h3><span>Pool · $${esc(a.ticker)} / KAIROS</span><span>0.3% fee to liquidity</span></h3><select class="in" style="height:40px" onchange="CUR=this.value;render()">${ASSETS.filter((x) => x.pool).map((x) => `<option value="${x.id}" ${x.id === CUR ? 'selected' : ''}>$${esc(x.ticker)}</option>`).join('')}</select>
   <div class="kv" style="margin-top:12px"><div><span>KAIROS reserve</span><b>${f6(a.pool.kai, 4)}</b></div><div><span>${esc(a.ticker)} reserve</span><b>${f6(a.pool.tok, 2)}</b></div><div><span>Price</span><b>${fmtP(a.price)} KAIROS</b></div><div><span>Your share</span><b>${lp > 0n ? (Number(lp * 10000n / BigInt(a.pool.lp)) / 100).toFixed(2) + '%' : '—'}</b></div></div>
   ${a.mode === 'launch' ? '<p class="dim" style="font-size:13px;margin-top:12px">The liquidity created at graduation is locked forever. Anyone can add more alongside it.</p>' : ''}</div>
   <div class="pan"><h3><span>Add liquidity</span></h3><div class="lbl"><span>KAIROS</span></div><input class="in" id="lk" inputmode="decimal" oninput="$('lt').value=(parseFloat(this.value||0)*Number(_A.pool.tok)/Number(_A.pool.kai)).toFixed(6)"><div class="lbl"><span>${esc(a.ticker)}</span></div><input class="in" id="lt" inputmode="decimal">
    <div style="display:flex;gap:8px;margin-top:14px"><button class="btn pri" style="flex:1;justify-content:center" onclick="send({type:'addLiquidity',asset:_A.id,kai:String(Math.floor(parseFloat($('lk').value||0)*1e6)),tok:String(Math.floor(parseFloat($('lt').value||0)*1e6))},_A.id,'lm')">Add</button><button class="btn" onclick="send({type:'removeLiquidity',asset:_A.id},_A.id,'lm')" ${lp > 0n ? '' : 'disabled'}>Remove mine</button></div><div class="msg" id="lm"></div></div></div>`; window._A = a; }
function vCreate() { const back = () => { const s = parseFloat($('cs').value) || 0, b = parseFloat($('cb').value) || 0; $('rb').textContent = (s * b).toLocaleString(undefined, { maximumFractionDigits: 6 }) + ' KAIROS'; $('rt').textContent = (s * b + 1).toLocaleString(undefined, { maximumFractionDigits: 6 }) + ' KAIROS'; };
  $('view').innerHTML = `<div class="tl"><div class="pan"><h3><span>Create token</span></h3><div class="seg"><button class="n ${MODE === 'launch' ? 'on' : ''}" onclick="MODE='launch';render()">Launchpad</button><button class="n ${MODE === 'direct' ? 'on' : ''}" onclick="MODE='direct';render()">Direct issue</button></div>
   <div class="lbl"><span>Token name</span></div><input class="in" id="cn" maxlength="32" placeholder="Orbit"><div class="lbl"><span>Ticker</span></div><input class="in" id="ct" maxlength="8" placeholder="ORB" oninput="this.value=this.value.toUpperCase().replace(/[^A-Z0-9]/g,'')">
   <div class="lbl"><span>Total supply · whole tokens</span></div><input class="in" id="cs" value="1000000" inputmode="numeric"><div class="lbl"><span>Backing per token · KAIROS</span><span>minimum 0.00001</span></div><input class="in" id="cb" value="0.00001" inputmode="decimal">
   <div class="lbl"><span>Colour</span></div><input class="in" id="cc" type="color" value="#79adff" style="padding:4px;height:46px"><div class="lbl"><span>Description · optional</span></div><input class="in" id="cd" maxlength="140" placeholder="A short description">
   <button class="btn pri" style="width:100%;justify-content:center;margin-top:16px;height:50px" onclick="create()">Review &amp; create</button><div class="msg" id="cm"></div></div>
   <div class="pan"><h3><span>Fixed rights</span></h3><div class="kv"><div><span>Issuance</span><b>Once, at creation</b></div><div><span>Additional minting</span><b>Never</b></div><div><span>Required backing</span><b id="rb"></b></div><div><span>Total cost</span><b id="rt"></b></div></div>
   <p style="color:var(--ink2);font-size:14px;margin-top:14px;line-height:1.6">Holders can burn tokens to redeem their backing at any time. The creator can never withdraw the holder reserve.</p>
   <p style="color:var(--ink3);font-size:13px;margin-top:10px;line-height:1.6">${MODE === 'launch' ? '80% of supply sells on the bonding curve until it raises 200 KAIROS, then the token graduates: the other 20% and the raise become a native pool under the same asset id, with that liquidity locked.' : 'The whole supply goes to you. Open a market by adding liquidity.'}</p></div></div>`;
  ['cs', 'cb'].forEach((i) => $(i).addEventListener('input', back)); back(); }
function create() { const v = (i) => $(i).value.trim(); const back = Math.round(parseFloat(v('cb')) * ONE);
  send({ type: 'create', name: v('cn'), ticker: v('ct'), supply: String(Math.floor(+v('cs') || 0)), backing: String(back), mode: MODE, color: v('cc'), desc: v('cd') }, null, 'cm'); }
function vMine() { if (!M) { $('view').innerHTML = '<div class="pan empty">Open your wallet to see your tokens. <a class="btn pri" style="margin-left:10px" href="/wallet">Wallet</a></div>'; return; }
  const agg = new Map(); for (const w of ACC) for (const h of w.hold) { const x = agg.get(h.id) || { ...h, bal: 0n }; x.bal += BigInt(h.bal); agg.set(h.id, x); }
  const rows = [...agg.values()]; $('view').innerHTML = rows.length ? `<div class="pan">${rows.map((h) => { const a = ASSETS.find((x) => x.id === h.id) || {}; return `<div class="row" style="padding:14px 0;border-bottom:1px solid var(--rule);flex-wrap:wrap"><div style="display:flex;gap:12px;align-items:center">${logo({ ...a, ticker: h.ticker, color: h.color })}<div><b>${esc(h.name)}</b><div class="mono" style="font-size:12px;color:var(--ink3)">$${esc(h.ticker)} · ${fmtP(h.price)} KAIROS</div></div></div>
     <div class="mono" style="font-size:18px">${f6(h.bal, 4)}</div><div style="display:flex;gap:8px"><button class="btn" onclick="openA('${h.id}')">Trade</button><button class="btn" onclick="send({type:'redeem',asset:'${h.id}',tok:'${h.bal}'},'${h.id}','rm_${h.id}')">Redeem backing</button></div><div class="msg" id="rm_${h.id}" style="width:100%"></div></div>`; }).join('')}</div>` : '<div class="pan empty">No tokens yet. Buy one on the launchpad or create your own.</div>'; }

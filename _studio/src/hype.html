<!doctype html><meta charset="utf-8">
<style>@import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;600;800;900&family=Geist+Mono:wght@400;500&display=swap');
*{margin:0;padding:0;box-sizing:border-box}html,body{width:1280px;height:720px;background:#04050a;color:#f4f1ea;font-family:Geist;overflow:hidden}
canvas{position:absolute;inset:0}.c{position:absolute;inset:0;display:grid;place-items:center;text-align:center;opacity:0}
.d{font-weight:800;letter-spacing:-.055em;line-height:.92}.g{background:linear-gradient(100deg,#ffe2a1,#ffc35a 35%,#ff8a3d);-webkit-background-clip:text;background-clip:text;color:transparent}
.r{color:#ff5d4f}.k{font-family:'Geist Mono';font-size:15px;letter-spacing:.28em;text-transform:uppercase;color:#ffc35a}</style>
<canvas id="cv" width="1280" height="720"></canvas>
<div class="c" id="a"><div><div class="k" style="color:#ff5d4f">every other chain</div><div class="d" style="font-size:92px;margin-top:20px">Replays its <span class="r">history.</span></div></div></div>
<div class="c" id="b"><div class="d" style="font-size:150px">Kairos <span class="g">doesn't.</span></div></div>
<div class="c" id="c" style="place-items:end center;padding-bottom:70px"><div><div class="k">one block · one proof</div><div class="d" style="font-size:62px;margin-top:14px">Every block proves <span class="g">all of time.</span></div></div></div>
<div class="c" id="d"><div class="d" style="font-size:96px" id="w"></div></div>
<div class="c" id="e"><div><svg viewBox="0 0 40 40" width="110" height="110" fill="none"><circle cx="20" cy="20" r="17" stroke="#f4f1ea" stroke-width="1.4"/><circle cx="20" cy="20" r="10.5" stroke="#f4f1ea" stroke-opacity=".35" stroke-dasharray="1.6 2.4"/><path d="M20 20 31 9" stroke="#ffc35a" stroke-width="2.2" stroke-linecap="round"/><circle cx="31" cy="9" r="3.2" fill="#ffc35a"/><circle cx="20" cy="20" r="2.4" fill="#f4f1ea"/></svg>
 <div class="d" style="font-size:110px;margin-top:20px">Kairos Chain</div><div class="d" style="font-size:48px;margin-top:16px">The proof-native <span class="g">Layer 1 blockchain.</span></div><div style="font-family:'Geist Mono';font-size:22px;letter-spacing:.14em;color:#ffc35a;margin-top:34px">kairoschain.org · $KAI</div></div></div>
<script>
const $ = (i) => document.getElementById(i), cl = (x) => Math.max(0, Math.min(1, x)), e = (x) => 1 - Math.pow(1 - cl(x), 3), win = (t, a, b, f = .35) => cl((t - a) / f) * cl((b - t) / f);
const g = $('cv').getContext('2d'), W = ['No replay.', 'No signatures.', 'No trusted setup.'];
window.__seek = (t) => { g.clearRect(0, 0, 1280, 720);
  // stars
  for (let i = 0; i < 140; i++) { const x = (i * 9301 % 1280), y = (i * 4933 % 720), z = (i % 7) / 7; g.fillStyle = `rgba(244,241,234,${.05 + z * .2})`; g.fillRect(x, y, 1 + z, 1 + z); }
  // act a: red replay bars
  const pa = win(t, 0, 3.2); if (pa > 0) for (let i = 0; i < 60; i++) { const grow = e((t - i * .03) / 1.2), h = (10 + i * i * .1) * grow; g.fillStyle = `rgba(255,93,79,${(.12 + i * .012) * pa})`; g.fillRect(100 + i * 18, 640 - h, 12, h); }
  // act c: orrery building ring by ring
  const pc = win(t, 5.6, 11.4, .5); if (pc > 0) { const cx = 640, cy = 300, n = Math.min(10, Math.floor((t - 5.8) * 2.2));
    for (let k = 0; k <= n; k++) { const r = 24 + k * 22, last = k === n; g.strokeStyle = last ? `rgba(255,195,90,${pc})` : `rgba(244,241,234,${(.1 + k * .04) * pc})`; g.lineWidth = last ? 2.4 : 1; g.setLineDash(k % 2 && !last ? [2, 6] : []); g.beginPath(); g.arc(cx, cy, r, 0, Math.PI * 2); g.stroke(); }
    g.setLineDash([]); const a = -Math.PI / 2 + (t - 5.6) * 1.4, R = 24 + n * 22; g.strokeStyle = `rgba(255,195,90,${pc})`; g.lineWidth = 2; g.beginPath(); g.moveTo(cx, cy); g.lineTo(cx + R * Math.cos(a), cy + R * Math.sin(a)); g.stroke();
    g.fillStyle = `rgba(255,195,90,${pc})`; g.beginPath(); g.arc(cx + R * Math.cos(a), cy + R * Math.sin(a), 5, 0, 7); g.fill(); g.fillStyle = `rgba(244,241,234,${pc})`; g.beginPath(); g.arc(cx, cy, 5, 0, 7); g.fill(); }
  // act e: big dial behind the logo
  const pe = e((t - 15.2) / .8); if (pe > 0) for (let k = 0; k < 120; k++) { const a = k / 120 * Math.PI * 2 + t * .05, r1 = 330, r2 = k % 10 ? 340 : 352; g.strokeStyle = `rgba(244,241,234,${.12 * pe})`; g.beginPath(); g.moveTo(640 + r1 * Math.cos(a), 360 + r1 * Math.sin(a)); g.lineTo(640 + r2 * Math.cos(a), 360 + r2 * Math.sin(a)); g.stroke(); }
  $('a').style.opacity = win(t, .2, 3.2); $('b').style.opacity = win(t, 3.2, 5.6); $('b').firstChild.style.transform = `scale(${1.2 - .2 * e((t - 3.2) / .5)})`;
  $('c').style.opacity = win(t, 6.4, 11.4, .5); $('d').style.opacity = win(t, 11.4, 15.2);
  const k = Math.min(2, Math.floor((t - 11.4) / 1.15)); $('w').innerHTML = t > 11.4 ? W.slice(0, k + 1).map((x, i) => `<div class="${i === k ? 'g' : ''}" style="opacity:${i === k ? 1 : .3}">${x}</div>`).join('') : '';
  $('e').style.opacity = e((t - 15.2) / .7); $('e').firstChild.style.transform = `translateY(${(1 - e((t - 15.2) / .9)) * 30}px)`; };
window.__ready = document.fonts.ready; window.__seek(0);
</script>
